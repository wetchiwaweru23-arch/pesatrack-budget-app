<!DOCTYPE html>
<html lang="en>
<head>
    <meta charset="UTF-8"
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
    <title>dynamic weekly Budget tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
      <h1>Weekly Budget tracker</h1>
      
    <div class="setup-section">
         <label for="weekly-total">set Total Weekly Budget (ksh):</label>
         <input type="number" id="weekly-total" value="980" min="1">
         <button id="start-btn">Set Budget</button>
    </div>
     
    <div clas="dashboard">
        <div class="stat-card">
            <h3>remaining Total</h3>
            <p id="remaining-total"ksh 980.00</p>
        </div>
    <div class="stat-card">
        <h3>new daily limit</h3>
        <p id="suggested-daily">ksh 140.00</p>
    </div>
 </div>

 <h2>Daily spending LOg</h2>
 <div id="days-container" class="days-grid">

 </div>
</div>

<script src="script.js"></script>
</body>
</html>
